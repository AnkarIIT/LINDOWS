# Limine configuration file for LINDOWS Phase 3 (64-bit long mode)
# This file must reside in the FAT32 partition's root (or a sub-path
# that Limine scans — see CONFIG.md for candidate locations).
#
# Scanned candidates (in order, first match wins):
#   /boot/limine/limine.conf, /boot/limine.conf, /limine/limine.conf, /limine.conf

timeout: 0
serial: yes
protocol: limine
path: boot():/boot/lindows64.bin

# End of file